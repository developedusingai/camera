<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaroid Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
        }

        .camera-container {
            background: #f5f5f5;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .viewfinder {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-filter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .filter-none { filter: none; }
        .filter-vintage { filter: sepia(0.5) contrast(1.2) brightness(0.9); }
        .filter-bw { filter: grayscale(1) contrast(1.1); }
        .filter-warm { filter: saturate(1.3) hue-rotate(-10deg) brightness(1.1); }
        .filter-cool { filter: saturate(0.8) hue-rotate(10deg) brightness(0.95); }
        .filter-fade { filter: contrast(0.85) brightness(1.2) saturate(0.8); }

        #canvas, #polaroidCanvas {
            display: none;
        }

        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
            z-index: 10;
        }

        .flash.active {
            opacity: 1;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding: 5px 0;
        }

        .filter-btn {
            background: white;
            border: 2px solid #ddd;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            color: #333;
            font-weight: 500;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        button {
            background: #667eea;
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(0);
        }

        #captureBtn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            padding: 0;
            border: 5px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #switchBtn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            padding: 0;
            font-size: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .polaroid {
            background: white;
            padding: 15px 15px 50px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: rotate(0deg);
            transition: transform 0.3s;
            cursor: pointer;
            position: relative;
        }

        .polaroid:hover {
            transform: rotate(2deg) scale(1.05);
            z-index: 10;
        }

        .polaroid:nth-child(even) {
            transform: rotate(-2deg);
        }

        .polaroid:nth-child(even):hover {
            transform: rotate(-4deg) scale(1.05);
        }

        .polaroid img {
            width: 100%;
            display: block;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .polaroid .date {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        .polaroid .download-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(102, 126, 234, 0.9);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            padding: 0;
        }

        .polaroid:hover .download-btn {
            opacity: 1;
        }

        .error {
            color: #d32f2f;
            text-align: center;
            padding: 20px;
            background: #ffebee;
            border-radius: 10px;
            margin: 20px 0;
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷</h1>
        
        <div class="camera-container">
            <div class="viewfinder">
                <video id="video" autoplay playsinline></video>
                <div class="flash" id="flash"></div>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="none">Original</button>
                <button class="filter-btn" data-filter="vintage">Vintage</button>
                <button class="filter-btn" data-filter="bw">B&W</button>
                <button class="filter-btn" data-filter="warm">Warm</button>
                <button class="filter-btn" data-filter="cool">Cool</button>
                <button class="filter-btn" data-filter="fade">Fade</button>
            </div>
            
            <div class="controls">
                <button id="switchBtn">🔄</button>
                <button id="captureBtn">📸</button>
            </div>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        
        <canvas id="canvas"></canvas>
        <canvas id="polaroidCanvas"></canvas>
        
        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const polaroidCanvas = document.getElementById('polaroidCanvas');
        const ctx = canvas.getContext('2d');
        const polaroidCtx = polaroidCanvas.getContext('2d');
        const captureBtn = document.getElementById('captureBtn');
        const switchBtn = document.getElementById('switchBtn');
        const gallery = document.getElementById('gallery');
        const flash = document.getElementById('flash');
        const errorDiv = document.getElementById('error');
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        let currentStream = null;
        let facingMode = 'user';
        let photos = [];
        let currentFilter = 'none';

        // Filter button handlers
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                video.className = `filter-${currentFilter}`;
            });
        });

        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1080 },
                        height: { ideal: 1080 }
                    }
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                errorDiv.style.display = 'none';
            } catch (err) {
                console.error('Error accessing camera:', err);
                errorDiv.textContent = 'Unable to access camera. Please allow camera permissions.';
                errorDiv.style.display = 'block';
            }
        }

        switchBtn.addEventListener('click', () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startCamera();
        });

        function applyFilterToCanvas(ctx, width, height, filter) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            switch(filter) {
                case 'vintage':
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        data[i] = r * 1.2;
                        data[i + 1] = g * 0.9;
                        data[i + 2] = b * 0.7;
                    }
                    break;
                case 'bw':
                    for (let i = 0; i < data.length; i += 4) {
                        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                        data[i] = data[i + 1] = data[i + 2] = avg;
                    }
                    break;
                case 'warm':
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.min(255, data[i] * 1.1);
                        data[i + 2] = data[i + 2] * 0.9;
                    }
                    break;
                case 'cool':
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = data[i] * 0.9;
                        data[i + 2] = Math.min(255, data[i + 2] * 1.1);
                    }
                    break;
                case 'fade':
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.min(255, data[i] * 1.2);
                        data[i + 1] = Math.min(255, data[i + 1] * 1.2);
                        data[i + 2] = Math.min(255, data[i + 2] * 1.2);
                    }
                    break;
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function createPolaroidImage(imageCanvas, date) {
            const padding = 40;
            const bottomPadding = 120;
            const imgSize = imageCanvas.width;
            
            polaroidCanvas.width = imgSize + (padding * 2);
            polaroidCanvas.height = imgSize + padding + bottomPadding;
            
            // White background
            polaroidCtx.fillStyle = 'white';
            polaroidCtx.fillRect(0, 0, polaroidCanvas.width, polaroidCanvas.height);
            
            // Draw image
            polaroidCtx.drawImage(imageCanvas, padding, padding, imgSize, imgSize);
            
            // Add date text
            polaroidCtx.fillStyle = '#666';
            polaroidCtx.font = '24px "Courier New", monospace';
            polaroidCtx.textAlign = 'center';
            polaroidCtx.fillText(date, polaroidCanvas.width / 2, imgSize + padding + 70);
            
            return polaroidCanvas.toDataURL('image/jpeg', 0.95);
        }

        captureBtn.addEventListener('click', () => {
            // Flash effect
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 100);

            // Set canvas size to match video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Draw video frame
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Apply filter
            if (currentFilter !== 'none') {
                applyFilterToCanvas(ctx, canvas.width, canvas.height, currentFilter);
            }

            // Create date string
            const date = new Date().toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric' 
            });

            // Create polaroid version
            const polaroidUrl = createPolaroidImage(canvas, date);
            
            // Also save preview version (without polaroid frame)
            const previewUrl = canvas.toDataURL('image/jpeg', 0.95);
            
            photos.unshift({ polaroidUrl, previewUrl, date });
            renderGallery();
        });

        function renderGallery() {
            gallery.innerHTML = '';
            
            photos.forEach((photo, index) => {
                const polaroid = document.createElement('div');
                polaroid.className = 'polaroid';
                
                const img = document.createElement('img');
                img.src = photo.previewUrl;
                
                const date = document.createElement('div');
                date.className = 'date';
                date.textContent = photo.date;
                
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-btn';
                downloadBtn.textContent = '⬇';
                downloadBtn.onclick = (e) => {
                    e.stopPropagation();
                    downloadPhoto(photo, index);
                };
                
                polaroid.appendChild(img);
                polaroid.appendChild(date);
                polaroid.appendChild(downloadBtn);
                gallery.appendChild(polaroid);
            });
        }

        function downloadPhoto(photo, index) {
            const link = document.createElement('a');
            link.href = photo.polaroidUrl;
            link.download = `polaroid-${Date.now()}.jpg`;
            link.click();
        }

        // Start camera on load
        startCamera();
    </script>
</body>
</html>
