<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaroid Camera</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1714">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Polaroid">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --cream: #f8f5f0;
            --dark: #1a1714;
            --accent: #c84b31;
            --accent2: #e8a87c;
            --muted: #8a8480;
            --border: #e0dad3;
            --card-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Top Bar ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            border-bottom: 1px solid var(--border);
            background: var(--cream);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            color: var(--dark);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span { color: var(--accent); }

        .header-meta {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ── Main Layout ── */
        .app {
            display: grid;
            grid-template-columns: 480px 1fr;
            min-height: calc(100vh - 57px);
        }

        /* ── Left Panel: Camera ── */
        .camera-panel {
            border-right: 1px solid var(--border);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--cream);
            position: sticky;
            top: 57px;
            height: calc(100vh - 57px);
            overflow-y: auto;
        }

        .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        /* Viewfinder */
        .viewfinder-wrap {
            position: relative;
        }

        .viewfinder {
            position: relative;
            width: 100%;
            background: var(--dark);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(26,23,20,0.18), inset 0 0 0 1px rgba(255,255,255,0.05);
        }

        .viewfinder.ratio-1-1 { aspect-ratio: 1/1; }
        .viewfinder.ratio-4-3 { aspect-ratio: 4/3; }
        .viewfinder.ratio-16-9 { aspect-ratio: 16/9; }
        .viewfinder.ratio-9-16 { aspect-ratio: 9/16; }
        .viewfinder.ratio-3-4 { aspect-ratio: 3/4; }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Filters applied to video */
        .filter-none { filter: none; }
        .filter-vintage { filter: sepia(0.5) contrast(1.2) brightness(0.9); }
        .filter-bw { filter: grayscale(1) contrast(1.1); }
        .filter-warm { filter: saturate(1.3) hue-rotate(-10deg) brightness(1.1); }
        .filter-cool { filter: saturate(0.8) hue-rotate(10deg) brightness(0.95); }
        .filter-fade { filter: contrast(0.85) brightness(1.2) saturate(0.8); }

        .flash {
            position: absolute; inset: 0;
            background: white; opacity: 0;
            pointer-events: none;
            transition: opacity 0.08s;
            z-index: 10;
        }
        .flash.active { opacity: 1; }

        /* Corner reticles */
        .reticle {
            position: absolute;
            width: 20px; height: 20px;
            pointer-events: none;
            z-index: 5;
        }
        .reticle::before, .reticle::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.6);
        }
        .reticle.tl { top: 12px; left: 12px; }
        .reticle.tl::before { top:0; left:0; width:2px; height:10px; }
        .reticle.tl::after  { top:0; left:0; width:10px; height:2px; }
        .reticle.tr { top: 12px; right: 12px; }
        .reticle.tr::before { top:0; right:0; width:2px; height:10px; }
        .reticle.tr::after  { top:0; right:0; width:10px; height:2px; }
        .reticle.bl { bottom: 12px; left: 12px; }
        .reticle.bl::before { bottom:0; left:0; width:2px; height:10px; }
        .reticle.bl::after  { bottom:0; left:0; width:10px; height:2px; }
        .reticle.br { bottom: 12px; right: 12px; }
        .reticle.br::before { bottom:0; right:0; width:2px; height:10px; }
        .reticle.br::after  { bottom:0; right:0; width:10px; height:2px; }

        /* Pill selectors */
        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .pill {
            background: white;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.15s;
            letter-spacing: 0.5px;
        }

        .pill:hover { border-color: var(--accent); color: var(--accent); }
        .pill.active {
            background: var(--dark);
            border-color: var(--dark);
            color: white;
        }

        /* Controls row */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 8px 0;
        }

        .ctrl-btn {
            background: white;
            border: 1px solid var(--border);
            color: var(--dark);
            width: 48px; height: 48px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 0;
        }

        .ctrl-btn:hover { border-color: var(--accent); transform: scale(1.05); }

        .capture-btn {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(200,75,49,0.35);
            transition: all 0.15s;
            position: relative;
        }

        .capture-btn::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0.4;
        }

        .capture-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 6px 28px rgba(200,75,49,0.45);
        }

        .capture-btn:active { transform: scale(0.96); }

        /* Counter */
        .counter {
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        /* Error */
        .error {
            color: var(--accent);
            font-size: 12px;
            padding: 14px;
            background: rgba(200,75,49,0.08);
            border: 1px solid rgba(200,75,49,0.2);
            border-radius: 4px;
        }

        /* ── Right Panel: Gallery ── */
        .gallery-panel {
            padding: 32px 40px;
            overflow-y: auto;
        }

        .gallery-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .gallery-title {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            color: var(--dark);
        }

        .gallery-count {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 2px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 16px;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 56px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Masonry-style gallery */
        .gallery {
            columns: 3;
            column-gap: 20px;
        }

        @media (max-width: 1200px) { .gallery { columns: 2; } }

        .polaroid-wrap {
            break-inside: avoid;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .polaroid {
            background: white;
            padding: 12px 12px 44px;
            box-shadow: 0 4px 18px rgba(26,23,20,0.10);
            transition: all 0.25s cubic-bezier(.22,.68,0,1.2);
            position: relative;
        }

        .polaroid-wrap:nth-child(3n+1) .polaroid { transform: rotate(-1.5deg); }
        .polaroid-wrap:nth-child(3n+2) .polaroid { transform: rotate(0.8deg); }
        .polaroid-wrap:nth-child(3n+3) .polaroid { transform: rotate(-0.4deg); }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.03) translateY(-4px) !important;
            box-shadow: 0 16px 40px rgba(26,23,20,0.18);
            z-index: 20;
        }

        .polaroid img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .polaroid-meta {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
        }

        .polaroid-date {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        .dl-btn {
            width: 26px; height: 26px;
            border-radius: 50%;
            background: var(--dark);
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 0;
            box-shadow: none;
        }

        .polaroid:hover .dl-btn { opacity: 1; }

        #canvas, #polaroidCanvas { display: none; }

        /* ── Responsive: mobile stack ── */
        @media (max-width: 768px) {
            .app {
                grid-template-columns: 1fr;
            }

            .camera-panel {
                position: static;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .gallery-panel { padding: 24px 20px; }

            .gallery { columns: 2; }

            header { padding: 14px 20px; }
        }

        /* ── Install Banner ── */
        #installBanner {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark);
            color: white;
            border-radius: 100px;
            padding: 14px 20px;
            font-size: 13px;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.28);
            display: none;
            align-items: center;
            gap: 14px;
            z-index: 999;
            white-space: nowrap;
        }
        #installBanner.show { display: flex; }
        #installBanner .install-icon { font-size: 20px; }
        #installBanner .install-text strong { display: block; font-size: 13px; margin-bottom: 1px; }
        #installBanner .install-text span { color: #999; font-size: 11px; }
        .install-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 12px;
            font-family: 'DM Mono', monospace;
            cursor: pointer;
            letter-spacing: 0.5px;
            width: auto; height: auto;
            box-shadow: none;
            transition: opacity 0.15s;
        }
        .install-btn:hover { opacity: 0.85; transform: none; }
        .install-dismiss {
            background: none; border: none; color: #666;
            font-size: 18px; cursor: pointer;
            padding: 0; width: auto; height: auto;
            box-shadow: none; line-height: 1;
        }
        .install-dismiss:hover { color: #aaa; transform: none; box-shadow: none; }

        /* Install button in header */
        #headerInstallBtn {
            display: none;
            background: var(--accent);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            cursor: pointer;
            letter-spacing: 1px;
            width: auto; height: auto;
            box-shadow: none;
        }
        #headerInstallBtn.show { display: flex; align-items: center; gap: 6px; }
        #headerInstallBtn:hover { opacity: 0.85; transform: none; box-shadow: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">📷 <span>Polaroid</span> Studio</div>
    <div style="display:flex;align-items:center;gap:16px;">
        <div class="header-meta">Film Camera App</div>
        <button id="headerInstallBtn">⬇ Install App</button>
    </div>
</header>

<!-- Install Banner -->
<div id="installBanner">
    <span class="install-icon">📷</span>
    <div class="install-text">
        <strong>Install Polaroid Studio</strong>
        <span>Works offline · No app store needed</span>
    </div>
    <button class="install-btn" id="installAccept">Install</button>
    <button class="install-dismiss" id="installDismiss">✕</button>
</div>

<div class="app">

    <!-- ── Camera Panel ── -->
    <aside class="camera-panel">

        <div class="viewfinder-wrap">
            <div class="viewfinder ratio-1-1" id="viewfinder">
                <video id="video" autoplay playsinline></video>
                <div class="flash" id="flash"></div>
                <div class="reticle tl"></div>
                <div class="reticle tr"></div>
                <div class="reticle bl"></div>
                <div class="reticle br"></div>
            </div>
        </div>

        <div id="error" class="error" style="display:none;"></div>

        <!-- Aspect Ratio -->
        <div>
            <div class="section-label">Aspect Ratio</div>
            <div class="pill-row" id="ratioBtns">
                <button class="pill active" data-ratio="1-1">1 : 1</button>
                <button class="pill" data-ratio="4-3">4 : 3</button>
                <button class="pill" data-ratio="16-9">16 : 9</button>
                <button class="pill" data-ratio="3-4">3 : 4</button>
                <button class="pill" data-ratio="9-16">9 : 16</button>
            </div>
        </div>

        <!-- Filters -->
        <div>
            <div class="section-label">Filter</div>
            <div class="pill-row" id="filterBtns">
                <button class="pill active" data-filter="none">Original</button>
                <button class="pill" data-filter="vintage">Vintage</button>
                <button class="pill" data-filter="bw">B&amp;W</button>
                <button class="pill" data-filter="warm">Warm</button>
                <button class="pill" data-filter="cool">Cool</button>
                <button class="pill" data-filter="fade">Fade</button>
            </div>
        </div>

        <!-- Shutter Controls -->
        <div class="controls">
            <button class="ctrl-btn" id="switchBtn" title="Flip Camera">🔄</button>
            <button class="capture-btn" id="captureBtn" title="Take Photo">📸</button>
            <button class="ctrl-btn" id="timerBtn" title="Self Timer">⏱</button>
        </div>

        <div class="counter" id="counter">0 photos taken</div>

    </aside>

    <!-- ── Gallery Panel ── -->
    <main class="gallery-panel">

        <div class="gallery-header">
            <div class="gallery-title">Film Roll</div>
            <div class="gallery-count" id="galleryCount">—</div>
        </div>

        <div id="emptyState" class="empty-state">
            <div class="empty-icon">🎞</div>
            <p>Your photos will appear here</p>
        </div>

        <div class="gallery" id="gallery"></div>

    </main>

</div>

<canvas id="canvas"></canvas>
<canvas id="polaroidCanvas"></canvas>

<script>
    const video          = document.getElementById('video');
    const canvas         = document.getElementById('canvas');
    const polaroidCanvas = document.getElementById('polaroidCanvas');
    const ctx            = canvas.getContext('2d');
    const polaroidCtx    = polaroidCanvas.getContext('2d');
    const captureBtn     = document.getElementById('captureBtn');
    const switchBtn      = document.getElementById('switchBtn');
    const timerBtn       = document.getElementById('timerBtn');
    const gallery        = document.getElementById('gallery');
    const flash          = document.getElementById('flash');
    const errorDiv       = document.getElementById('error');
    const viewfinder     = document.getElementById('viewfinder');
    const counter        = document.getElementById('counter');
    const galleryCount   = document.getElementById('galleryCount');
    const emptyState     = document.getElementById('emptyState');

    let currentStream = null;
    let facingMode    = 'user';
    let photos        = [];
    let currentFilter = 'none';
    let currentRatio  = '1-1';
    let timerActive   = false;
    let timerSeconds  = 0; // 0 = off, 3, 10

    // ── Ratio Buttons ──
    document.getElementById('ratioBtns').addEventListener('click', e => {
        const btn = e.target.closest('.pill');
        if (!btn) return;
        document.querySelectorAll('#ratioBtns .pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRatio = btn.dataset.ratio;
        viewfinder.className = `viewfinder ratio-${currentRatio}`;
    });

    // ── Filter Buttons ──
    document.getElementById('filterBtns').addEventListener('click', e => {
        const btn = e.target.closest('.pill');
        if (!btn) return;
        document.querySelectorAll('#filterBtns .pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        video.className = `filter-${currentFilter}`;
    });

    // ── Timer Button ──
    const timerCycles = [0, 3, 10];
    timerBtn.addEventListener('click', () => {
        const idx = timerCycles.indexOf(timerSeconds);
        timerSeconds = timerCycles[(idx + 1) % timerCycles.length];
        timerBtn.title = timerSeconds === 0 ? 'Self Timer' : `Timer: ${timerSeconds}s`;
        timerBtn.textContent = timerSeconds === 0 ? '⏱' : `${timerSeconds}s`;
    });

    // ── Camera ──
    async function startCamera() {
        try {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            currentStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode, width: { ideal: 1080 }, height: { ideal: 1080 } }
            });
            video.srcObject = currentStream;
            errorDiv.style.display = 'none';
        } catch (err) {
            errorDiv.textContent = 'Camera access denied — please allow permissions.';
            errorDiv.style.display = 'block';
        }
    }

    switchBtn.addEventListener('click', () => {
        facingMode = facingMode === 'user' ? 'environment' : 'user';
        startCamera();
    });

    // ── Capture ──
    function doCapture() {
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 120);

        const ratioMap = { '1-1': 1, '4-3': 4/3, '16-9': 16/9, '3-4': 3/4, '9-16': 9/16 };
        const targetAspect = ratioMap[currentRatio];
        const videoAspect  = video.videoWidth / video.videoHeight;

        let sx, sy, sw, sh;
        if (videoAspect > targetAspect) {
            sh = video.videoHeight; sw = sh * targetAspect;
            sx = (video.videoWidth - sw) / 2; sy = 0;
        } else {
            sw = video.videoWidth; sh = sw / targetAspect;
            sx = 0; sy = (video.videoHeight - sh) / 2;
        }

        const maxDim = 1080;
        if (targetAspect >= 1) { canvas.width = maxDim; canvas.height = maxDim / targetAspect; }
        else                   { canvas.height = maxDim; canvas.width = maxDim * targetAspect; }

        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
        if (currentFilter !== 'none') applyFilter(ctx, canvas.width, canvas.height, currentFilter);

        const date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        const polaroidUrl = makePolaroid(canvas, date);
        const previewUrl  = canvas.toDataURL('image/jpeg', 0.95);

        photos.unshift({ polaroidUrl, previewUrl, date });
        renderGallery();
    }

    captureBtn.addEventListener('click', () => {
        if (timerSeconds === 0) {
            doCapture();
        } else {
            let remaining = timerSeconds;
            captureBtn.textContent = remaining;
            captureBtn.style.pointerEvents = 'none';
            const tick = setInterval(() => {
                remaining--;
                if (remaining > 0) { captureBtn.textContent = remaining; }
                else {
                    clearInterval(tick);
                    captureBtn.textContent = '📸';
                    captureBtn.style.pointerEvents = '';
                    doCapture();
                }
            }, 1000);
        }
    });

    // ── Filter Processing ──
    function applyFilter(ctx, w, h, filter) {
        const d = ctx.getImageData(0, 0, w, h);
        const px = d.data;
        for (let i = 0; i < px.length; i += 4) {
            const r = px[i], g = px[i+1], b = px[i+2];
            switch (filter) {
                case 'vintage': px[i]=Math.min(255,r*1.2); px[i+1]=g*0.9; px[i+2]=b*0.7; break;
                case 'bw': { const avg=(r+g+b)/3; px[i]=px[i+1]=px[i+2]=avg; break; }
                case 'warm': px[i]=Math.min(255,r*1.1); px[i+2]=b*0.9; break;
                case 'cool': px[i]=r*0.9; px[i+2]=Math.min(255,b*1.1); break;
                case 'fade': px[i]=Math.min(255,r*1.2); px[i+1]=Math.min(255,g*1.2); px[i+2]=Math.min(255,b*1.2); break;
            }
        }
        ctx.putImageData(d, 0, 0);
    }

    // ── Polaroid Frame ──
    function makePolaroid(imgCanvas, date) {
        const pad = 40, bottom = 120;
        polaroidCanvas.width  = imgCanvas.width + pad * 2;
        polaroidCanvas.height = imgCanvas.height + pad + bottom;
        polaroidCtx.fillStyle = '#ffffff';
        polaroidCtx.fillRect(0, 0, polaroidCanvas.width, polaroidCanvas.height);
        polaroidCtx.drawImage(imgCanvas, pad, pad, imgCanvas.width, imgCanvas.height);
        polaroidCtx.fillStyle = '#888';
        polaroidCtx.font = '22px "Courier New", monospace';
        polaroidCtx.textAlign = 'center';
        polaroidCtx.fillText(date, polaroidCanvas.width / 2, imgCanvas.height + pad + 68);
        return polaroidCanvas.toDataURL('image/jpeg', 0.95);
    }

    // ── Gallery ──
    function renderGallery() {
        const count = photos.length;
        counter.textContent = `${count} photo${count !== 1 ? 's' : ''} taken`;
        galleryCount.textContent = count ? `${count} frame${count !== 1 ? 's' : ''}` : '—';
        emptyState.style.display = count ? 'none' : 'flex';
        gallery.style.display    = count ? 'block' : 'none';

        gallery.innerHTML = '';
        photos.forEach((photo, i) => {
            const wrap = document.createElement('div');
            wrap.className = 'polaroid-wrap';

            const pol = document.createElement('div');
            pol.className = 'polaroid';

            const img = document.createElement('img');
            img.src = photo.previewUrl;
            img.loading = 'lazy';

            const meta = document.createElement('div');
            meta.className = 'polaroid-meta';

            const dateEl = document.createElement('div');
            dateEl.className = 'polaroid-date';
            dateEl.textContent = photo.date;

            const dlBtn = document.createElement('button');
            dlBtn.className = 'dl-btn';
            dlBtn.innerHTML = '↓';
            dlBtn.title = 'Download';
            dlBtn.onclick = e => {
                e.stopPropagation();
                const a = document.createElement('a');
                a.href = photo.polaroidUrl;
                a.download = `polaroid-${Date.now()}.jpg`;
                a.click();
            };

            meta.appendChild(dateEl);
            meta.appendChild(dlBtn);
            pol.appendChild(img);
            pol.appendChild(meta);
            wrap.appendChild(pol);
            gallery.appendChild(wrap);
        });
    }

    renderGallery();
    startCamera();

    // ── PWA: Service Worker ──
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('SW registered:', reg.scope);
            }).catch(err => console.log('SW error:', err));
        });
    }

    // ── PWA: Install Prompt ──
    let deferredPrompt = null;
    const installBanner       = document.getElementById('installBanner');
    const installAccept       = document.getElementById('installAccept');
    const installDismiss      = document.getElementById('installDismiss');
    const headerInstallBtn    = document.getElementById('headerInstallBtn');

    window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        deferredPrompt = e;
        // Show banner after 3 seconds
        setTimeout(() => installBanner.classList.add('show'), 3000);
        headerInstallBtn.classList.add('show');
    });

    async function triggerInstall() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Install outcome:', outcome);
        deferredPrompt = null;
        installBanner.classList.remove('show');
        headerInstallBtn.classList.remove('show');
    }

    installAccept.addEventListener('click', triggerInstall);
    headerInstallBtn.addEventListener('click', triggerInstall);

    installDismiss.addEventListener('click', () => {
        installBanner.classList.remove('show');
    });

    window.addEventListener('appinstalled', () => {
        installBanner.classList.remove('show');
        headerInstallBtn.classList.remove('show');
        deferredPrompt = null;
        console.log('App installed!');
    });
</script>
</body>
</html>
